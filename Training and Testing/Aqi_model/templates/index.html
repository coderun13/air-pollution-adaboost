<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Air Quality Index Predictor</title>
<style>
  body { font-family: Arial, sans-serif; background: #f3f4f6; margin: 0; padding: 40px; }
  .card { max-width: 480px; margin: auto; background: #fff; border-radius: 12px;
          padding: 30px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.subtitle { color: #6b7280; margin-top: 0; margin-bottom: 20px; font-size: 14px; }
  label { display: block; margin-top: 12px; font-size: 14px; font-weight: bold; color: #374151; }
  input { width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #d1d5db;
          border-radius: 6px; box-sizing: border-box; }
  button { margin-top: 20px; width: 100%; padding: 10px; background: #6366f1;
           color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; }
  button:hover { background: #4f46e5; }
  .result { margin-top: 20px; padding: 15px; border-radius: 8px; color: #fff; text-align: center; }
  .result .aqi-value { font-size: 32px; font-weight: bold; }
  .result .category { font-size: 15px; margin-top: 4px; }
  .error { background: #fef2f2; border: 1px solid #ef4444; color: #b91c1c; padding: 15px; border-radius: 8px; margin-top: 20px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Air Quality Index Predictor</h1>
    <p class="subtitle">Enter pollutant readings to get the predicted US AQI value (AdaBoost model, trained on 842k real readings)</p>

    <form action="/predict" method="POST">
      <label>PM2.5 (µg/m³)</label>
      <input type="number" step="any" name="PM2.5" required>

      <label>PM10 (µg/m³)</label>
      <input type="number" step="any" name="PM10" required>

      <label>NO2 (µg/m³)</label>
      <input type="number" step="any" name="NO2" required>

      <label>SO2 (µg/m³)</label>
      <input type="number" step="any" name="SO2" required>

      <label>O3 (µg/m³)</label>
      <input type="number" step="any" name="O3" required>

      <label>CO (µg/m³)</label>
      <input type="number" step="any" name="CO" required>

      <button type="submit">Predict AQI</button>
    </form>

    {% if prediction is not none %}
      {% if category %}
        <div class="result" style="background: {{ color }};">
          <div class="aqi-value">AQI: {{ prediction }}</div>
          <div class="category">{{ category }}</div>
        </div>
      {% else %}
        <div class="error">{{ prediction }}</div>
      {% endif %}
    {% endif %}
  </div>
</body>
</html>
